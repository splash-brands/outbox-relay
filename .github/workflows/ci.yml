name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Rails 7.2 with Ruby 3.1 (Rails 8 requires Ruby 3.2+)
          - ruby-version: '3.1'
            rails-version: '~> 7.2.0'
          # Rails 8 with Ruby 3.2+
          - ruby-version: '3.2'
            rails-version: '~> 8.0'
          - ruby-version: '3.3'
            rails-version: '~> 8.0'

    env:
      RAILS_VERSION: ${{ matrix.rails-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rspec --format documentation

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Check for syntax errors
        run: |
          find lib -name "*.rb" -exec ruby -c {} \;
